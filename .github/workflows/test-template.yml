name: test-template
on: push
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
      - run: uv sync --group dev
      - run: uv run --group dev pytest tests/ -q
  verify-config:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
      - run: ./tests/verify.sh config
  verify-typescript:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
      - run: ./tests/verify.sh typescript
  verify-java:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          # no `cache: maven`: this repo has no pom.xml, the java pom is
          # rendered per-variant, and setup-java fails the job without one
          java-version: 25.0.5+8.0.LTS
      - run: ./tests/verify.sh java
