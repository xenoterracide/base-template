name: devtools-regression
on: push
permissions:
  contents: read
jobs:
  regression-prettier:
    uses: xenoterracide/github/.github/workflows/regression-devtool-prettier.yml@94b67449fc788e5c919680df100075e92fa446f1 # develop
  regression-git-conventional-commits:
    uses: xenoterracide/github/.github/workflows/regression-devtool-git-conventional-commits.yml@94b67449fc788e5c919680df100075e92fa446f1 # develop
  regression-lint-staged:
    uses: xenoterracide/github/.github/workflows/regression-devtool-lint-staged.yml@94b67449fc788e5c919680df100075e92fa446f1 # develop
  regression-reuse:
    uses: xenoterracide/github/.github/workflows/regression-devtool-reuse.yml@94b67449fc788e5c919680df100075e92fa446f1 # develop
  shell:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.asdf
          key: asdf-${{ runner.os }}-${{ hashFiles('.tool-versions') }}
          restore-keys: asdf-${{ runner.os }}-
      - uses: asdf-vm/actions/install@v4.0.1
      - run: shfmt --version
      - run: shellcheck --version
