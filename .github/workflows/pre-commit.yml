name: pre-commit
on: push
permissions:
  contents: read
jobs:
  license:
    uses: xenoterracide/github/.github/workflows/license.yml@2cbe15e8b03a049a30e364c16cde78038c443eda # develop
  prettier:
    uses: xenoterracide/github/.github/workflows/prettier.yml@2cbe15e8b03a049a30e364c16cde78038c443eda # develop
  shfmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.asdf
          key: asdf-${{ runner.os }}-${{ hashFiles('.tool-versions') }}
          restore-keys: asdf-${{ runner.os }}-
      - uses: asdf-vm/actions/install@v4.0.1
      - run: shfmt -d git/hooks/
