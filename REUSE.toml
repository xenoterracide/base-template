version = 1

[[annotations]]
path = "**/*.lockfile"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "pnpm-lock.yaml"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ".tool-versions"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "uv.lock"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ".python-version"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "gradle/wrapper/*"
SPDX-FileCopyrightText = "See MANIFEST.MF in jar"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "copier.yml"
SPDX-FileCopyrightText = "Copyright © 2026 Caleb Cushing"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
# jvm.config is a static authoring copy with no SPDX header; both the
# authoring and consumer REUSE.toml license it by annotation (CC0-1.0).
# This annotation matches the literal conditional path in the authoring tree.
path = "{% if template_type == 'java' %}.mvn{% endif %}/jvm.config"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "**/*.jinja"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "**/package.json"
SPDX-FileCopyrightText = "Copyright © 2026 Caleb Cushing"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "**/tsconfig*.json"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"
