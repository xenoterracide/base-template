[project]
name = "share"
version = "26.11.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["copier", "pyyaml", "pytest", "reuse>=6.2.0", "ruff"]

[tool.ruff]
# prettier parity; ruff defaults to black's 88
line-length = 120
# ruff owns python only: 0.17 also formats markdown and lints
# pyproject.toml, both prettier's files - two formatters drift apart
include = ["*.py", "**/*.py"]
