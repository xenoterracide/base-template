name: devtools-regression
on: push
permissions:
  contents: read
jobs:
  regression-prettier:
    uses: xenoterracide/github/.github/workflows/regression-devtool-prettier.yml@c6bb35fd70db192c73a4fe48d5e7f349514d9a92 # develop
  regression-git-conventional-commits:
    uses: xenoterracide/github/.github/workflows/regression-devtool-git-conventional-commits.yml@c6bb35fd70db192c73a4fe48d5e7f349514d9a92 # develop
  regression-lint-staged:
    uses: xenoterracide/github/.github/workflows/regression-devtool-lint-staged.yml@c6bb35fd70db192c73a4fe48d5e7f349514d9a92 # develop
  regression-reuse:
    uses: xenoterracide/github/.github/workflows/regression-devtool-reuse.yml@c6bb35fd70db192c73a4fe48d5e7f349514d9a92 # develop
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.asdf
          key: asdf-${{ runner.os }}-${{ hashFiles('.tool-versions') }}
          restore-keys: asdf-${{ runner.os }}-
      - uses: asdf-vm/actions/install@v4.0.1
      - run: shfmt --version
      - run: shellcheck --version
