name: test-template
on: push
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
      - run: ./tests/install-shfmt.sh
      - run: uv sync --group dev
      - run: uv run --group dev pytest tests/ -q
  verify:
    strategy:
      fail-fast: false
      matrix:
        variant: [java, typescript, config]
    uses: xenoterracide/github/.github/workflows/copier.yml@eb02ca8bddb8311e1dbde28290a8f055bd00f517 # develop
    with:
      variant: ${{ matrix.variant }}
