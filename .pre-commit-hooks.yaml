---
- id: share-commit-msg
  name: Validate conventional commit message
  entry: uv run --frozen git/hooks/commit-msg
  language: system
  stages: [commit-msg]

- id: share-post-checkout
  name: Sync tooling and autoupdate pre-commit hooks after checkout
  entry: uv run --frozen git/hooks/post-checkout
  language: system
  always_run: true
  pass_filenames: false
  stages: [post-checkout]

- id: share-post-merge
  name: Sync tooling after merge
  entry: uv run --frozen git/hooks/post-merge
  language: system
  always_run: true
  pass_filenames: false
  stages: [post-merge]
